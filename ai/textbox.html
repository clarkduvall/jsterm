<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text Box</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      padding: 24px;
      background: #ffffff;
      box-sizing: border-box;
    }

    textarea {
      width: 100%;
      height: 100%;
      padding: 16px;
      box-sizing: border-box;
      border: 2px solid #222222;
      border-radius: 8px;
      font: 24px/1.4 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      resize: none;
    }
  </style>
</head>
<body>
  <textarea autofocus aria-label="Text box"></textarea>
</body>
</html>
